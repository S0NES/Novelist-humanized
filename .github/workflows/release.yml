name: Release

# Push a tag such as v1.0.0 to build the skill zip and publish a GitHub Release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check package files
        run: python3 scripts/validate-package.py
      - name: Check the tag matches the skill version
        run: |
          version=$(grep -oP '^\s+version:\s*"?\K[0-9]+\.[0-9]+\.[0-9]+' SKILL.md)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match SKILL.md version $version"
            exit 1
          fi
      - name: Build release zip
        run: python3 scripts/build-release.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## /{n++} n==1' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Humanized Novelist $GITHUB_REF_NAME" \
            --notes "$notes"
